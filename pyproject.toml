[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sqlvec"
version = "0.1.0"
description = "Native vector search in SQL Server 2025 and Azure SQL: exact, DiskANN, hybrid RRF, and a pgvector side-by-side."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sharath Chandra Kampili" }]
keywords = ["sql-server", "azure-sql", "vector", "diskann", "hybrid-search", "rag", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "httpx>=0.27",
    # Microsoft's Python driver. Its Linux wheels ship the ODBC driver bits,
    # so there is no separate msodbcsql18 / unixODBC install.
    "mssql-python>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sqlvec = "sqlvec.cli:main"

[project.urls]
Homepage = "https://github.com/sharath568/azure-data-sql-vectors"
Issues = "https://github.com/sharath568/azure-data-sql-vectors/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlvec"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "sqlvec/sql"

[tool.hatch.build.targets.sdist]
include = ["src/sqlvec", "sql", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real SQL Server 2025 / Azure SQL database (set SQLVEC_TEST_CONN)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
